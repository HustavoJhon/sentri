# SENTRI configuration.
#
# Everything here can be edited: the profile, interests, scoring weights and
# sources. Secrets (API tokens, OAuth credentials) never go in this file; refer
# to them through environment variables (`token_env`).

[storage]
# database = "/custom/path/sentri.db"   # default: ~/.local/share/sentri/sentri.db

# First-run setup. New configurations start with `completed = false`, which
# opens the onboarding wizard once; files without this section skip it.
# Rerun it any time with `sentri onboarding` or from Settings.
[onboarding]
completed = false
startup_animation = true  # the Observer awakening shown while SENTRI starts
startup_style = "cinematic"  # cinematic (~7 s) or brief (~2 s); any key skips

[profile]
home_city = "Cusco"
country = "Peru"
country_code = "PE"       # ISO 3166-1 alpha-2; adds "Peru" and "Perú" to matching
# region = "Cusco"
# timezone = "America/Lima"   # default: your system time zone
location_aliases = ["Perú", "Cusco, Peru", "Lima", "Latin America", "LATAM", "Latinoamérica"]
preferred_modalities = ["online", "hybrid"]
avoid_keywords = ["senior", "10+ years", "unpaid"]

[[profile.interests]]
name = "Artificial intelligence"
keywords = ["ai", "ia", "artificial intelligence", "inteligencia artificial", "machine learning", "llm", "deep learning"]
categories = ["hackathon", "fellowship"]
priority = "high"

[[profile.interests]]
name = "Software development"
keywords = ["programming", "programación", "software", "developer", "backend", "rust", "go", "c#", "architecture"]
categories = ["course", "job", "internship"]
priority = "high"

[[profile.interests]]
name = "Linux and free software"
keywords = ["linux", "open source", "software libre", "foss", "sysadmin", "devops", "automation", "automatización"]
categories = ["open_source"]
priority = "high"

[[profile.interests]]
name = "International opportunities"
keywords = ["scholarship", "beca", "exchange", "intercambio", "travel", "fully funded", "flights", "accommodation"]
categories = ["scholarship", "exchange", "fellowship"]
priority = "medium"

[[profile.interests]]
name = "Entrepreneurship"
keywords = ["startup", "emprendimiento", "founder", "incubator", "accelerator"]
categories = ["competition", "call"]
priority = "medium"

[[profile.interests]]
name = "Developer communities"
keywords = ["gdg", "meetup", "community", "comunidad", "devfest", "conference"]
categories = ["meetup", "conference", "workshop"]
priority = "medium"

# How far from home opportunities may be. Turning one off only withholds
# its bonus; nothing is hidden. Remote, hybrid and in-person preferences are
# `profile.preferred_modalities` above.
[discovery]
local = true
national = true
international = true
# Topics that matter most: events, courses, hackathons, scholarships,
# competitions, communities, open_source, cfps, news, jobs
topics = []

# Rule weights (see docs/configuration.md). Omitted values use defaults.
[scoring]
# travel = 12
# home_city = 15

[http]
timeout_secs = 20
max_body_bytes = 3_000_000
max_redirects = 5

[daemon]
interval_minutes = 120

# Your public GitHub profile: avatar and name shown in the TUI.
# Only public data is read (no token).
[github]
# username = "your-github-user"

# Calendar preferences. Google Calendar sync is not implemented yet;
# `sentri calendar-doctor` checks the OAuth setup you can prepare today.
[calendar]
week_start = "monday"     # monday | sunday
default_view = "month"    # month | week | day | agenda
# google_credentials = "~/.config/sentri/google-oauth.json"

# Appearance (also editable from Settings in the TUI).
[ui]
density = "comfortable"   # compact | comfortable | detailed
images = "auto"           # auto | kitty | sixel | iterm2 | halfblock | ascii | off
colors = "auto"           # auto | truecolor | indexed
ascii_icons = false
show_sidebar = true
show_details = true
feed_width = 55           # % of the main area used by the feed
collect_on_start = "auto" # auto (empty or stale data) | always | never

# Dashboard. Widgets and metrics are drawn in the order listed; leave one out
# to hide it.
[dashboard]
layout = "detailed"       # detailed | compact
widgets = ["metrics", "activity", "interactions", "distribution", "recommendations", "upcoming", "news", "jobs"]
metrics = ["found", "new", "news", "events", "courses", "jobs", "saved", "liked", "applied", "calendar"]
recommendations = 10      # rows in the recommendations list (1-30)

# Feed cards.
[cards]
show_source = true
show_category = true
show_meter = true
# Facts under the title; leave one out to hide it.
facts = ["when", "deadline", "pay", "organizer", "place", "modality", "cost", "perks", "topic", "skills", "links"]
fact_order = "kind"       # kind (each card type's own order) | custom (order above)
dates = "both"            # both | relative | absolute
selection = "highlight"   # highlight (bar + shaded card) | rail (bar only)

# Sources. Each one is independent: if it fails, the others keep working.
[[sources]]
name = "freecodecamp-news"
kind = "rss"
url = "https://www.freecodecamp.org/news/rss/"
category = "course"
tags = ["programming"]
max_items = 30

[[sources]]
name = "github-good-first-issues"
kind = "github"
enabled = false
target = "issues"
query = "label:\"good first issue\" language:rust state:open"
category = "open_source"
max_items = 30
# Optional; raises the search rate limit from 10 to 30 requests/minute.
token_env = "SENTRI_GITHUB_TOKEN"

[[sources]]
name = "github-rust-tools"
kind = "github"
enabled = false
target = "repositories"
query = "topic:cli language:rust stars:>200 pushed:>2026-01-01"
category = "open_source"
max_items = 20
token_env = "SENTRI_GITHUB_TOKEN"

# ── Events, hackathons and competitions ─────────────────────────────────

# GDG Cusco: public chapter page + schema.org data of each event page
# (Bevy has no public API or feed; /api/ is disallowed by robots.txt).
[[sources]]
name = "gdg-cusco"
kind = "gdg"
url = "https://gdg.community.dev/gdg-cusco/"
category = "event"
max_items = 10

# ── Peruvian tech ecosystem ─────────────────────────────────────────────
# Peruanos.dev publishes a small public JSON API (https://www.peruanos.dev/apis).
# Four read-only sources cover the directory; each one is independent, so a
# change in one endpoint cannot break the others.

[[sources]]
name = "peruanos-events"
kind = "peruanos"
target = "events"
category = "event"
max_items = 50

[[sources]]
name = "peruanos-communities"
kind = "peruanos"
target = "communities"
category = "community"
max_items = 50

[[sources]]
name = "peruanos-projects"
kind = "peruanos"
target = "projects"
category = "open_source"
max_items = 50

[[sources]]
name = "peruanos-cfs"
kind = "peruanos"
target = "cfs"
category = "call_for_speakers"
max_items = 50

# More GDG chapters in Peru. Add the chapter page URL for other cities.
[[sources]]
name = "gdg-lima"
kind = "gdg"
url = "https://gdg.community.dev/gdg-lima/"
category = "event"
max_items = 10

[[sources]]
name = "gdg-cloud-lima"
kind = "gdg"
url = "https://gdg.community.dev/gdg-cloud-lima/"
category = "event"
max_items = 10

# hack0.dev only publishes HTML event pages with schema.org JSON-LD; its
# /api/ path is disallowed by robots.txt. The connector reads the public
# listing and a few event pages per run, keeping only Peru.
[[sources]]
name = "hack0"
kind = "hack0"
url = "https://hack0.dev/eventos"
category = "event"
max_items = 10

# dev.events lists meetups and conferences per country; robots.txt allows it
# and each listing embeds schema.org events, so one request reads them all.
# Use /conferences/SA/PE for conferences only.
[[sources]]
name = "dev-events-peru"
kind = "devevents"
url = "https://dev.events/meetups/SA/PE"
category = "event"
max_items = 50

# Get on Board: public jobs API (no key). `target` is the category and
# `query` the country the job must be open to (remote or on site).
[[sources]]
name = "getonboard-programming"
kind = "getonboard"
target = "programming"
query = "PE"
max_items = 40

[[sources]]
name = "getonboard-data-ai"
kind = "getonboard"
target = "machine-learning-ai"
query = "PE"
max_items = 20

# Luma: copy "Add iCal Subscription" from any public Luma calendar page.
[[sources]]
name = "luma-example"
kind = "luma"
enabled = false
url = "webcal://api.lu.ma/ics/get?entity=calendar&id=cal-REPLACE-ME"
max_items = 20

# Meetup: every group exposes https://www.meetup.com/<group>/events/ical/
[[sources]]
name = "meetup-example"
kind = "meetup"
enabled = false
url = "https://www.meetup.com/REPLACE-ME/events/ical/"
max_items = 20

# Devpost: undocumented JSON endpoint used by devpost.com (allowed by
# robots.txt; may change without notice). Opt-in.
[[sources]]
name = "devpost"
kind = "devpost"
enabled = false
max_items = 30

# Kaggle: official API, needs credentials. Put "username:key" (kaggle.json)
# or an API token in the variable below (e.g. in ~/.config/sentri/env).
[[sources]]
name = "kaggle"
kind = "kaggle"
enabled = false
token_env = "SENTRI_KAGGLE_CREDENTIALS"
max_items = 30

# ── Tech News ────────────────────────────────────────────────────────────
# `content = "news"` sends items to the Tech News section. `stance` sets the
# default nature of a source; company blogs are "official". Items are never
# marked as verified: reports are attributed to their outlet, and wording such
# as "reportedly" or "leak" marks them as unconfirmed.

[[sources]]
name = "hn-front-page"
kind = "hackernews"
content = "news"
max_items = 30

