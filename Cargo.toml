[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/HustavoJhon/sentri"

[workspace.dependencies]
sentri-core = { path = "crates/sentri-core" }
sentri-storage = { path = "crates/sentri-storage" }
sentri-sources = { path = "crates/sentri-sources" }
sentri-app = { path = "crates/sentri-app" }
sentri-tui = { path = "crates/sentri-tui" }

anyhow = "1.0.104"
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
feed-rs = "3.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "charset", "http2", "json", "query"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros", "chrono"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-input = "0.15.5"
url = { version = "2.5.8", features = ["serde"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = true
